schema: spec-driven

# Project context provided to AI agents when planning and building features
context: |
  Project: Cambialy (Currency Exchange & Financial Calculator App)
  Status: LIVE on Google Play (`com.cambialy.app`). Treat every change as shipping to real users
  who make financial decisions from the numbers this app displays. There is currently no OTA
  update channel, so a defect that reaches production requires a full store review to fix.

  Tech Stack & Versions:
  - Core: React Native 0.86 (New Architecture), Expo SDK 57, Expo Router (file-based, typed routes), TypeScript 6.0
  - React 19 Engine: Babel React Compiler plugin active (`babel-plugin-react-compiler`)
  - State & Data: Zustand 5.0 (slice selectors), TanStack React Query 5 (async server state), `@react-native-async-storage/async-storage`
  - Styling & Layout: React Native Unistyles (`import { StyleSheet, withUnistyles } from 'react-native-unistyles'`).
    * CRITICAL STYLING RULE: ALWAYS use Unistyles for styling. NEVER use Uniwind or Tailwind `className` anywhere in the codebase.
      (`global.css`, `uniwind` and `tailwindcss` are wired into Metro for HeroUI Native only — they are NOT an authoring surface.)
    * HeroUI Native components (`heroui-native`) may be used when necessary for native-feeling controls, styled via Unistyles.
  - Motion & Interaction: React Native Reanimated 4.5, React Native Gesture Handler (RNGH), `@lodev09/react-native-true-sheet`, `@shopify/flash-list`
  - Native surface: local Expo module `modules/rates-widget` (Android home-screen widget, Kotlin + WorkManager)
    and an iOS widget declared in `src/widgets/rates-widget.tsx` via `expo-widgets` + `@expo/ui/swift-ui`.
  - Localization: ALL user-facing copy is Spanish (es-VE). Number formatting is locale-sensitive and
    user-configurable (comma vs dot decimal separator) — never hardcode a separator in display logic.

  Architectural Principles & Conventions:
  - Feature-Driven Directory Layout: Code MUST be located in `src/features/<feature_name>/` with subfolders: `components/`, `screens/`, `hooks/`, `api/`, `types.ts`, `utils.ts`, `constants.ts`. Shared components live in `src/components/ui/`.
  - Named Exports Only: Use named exports (`export function ComponentName...`) for all components, screens, and hooks. Avoid default exports except where required by Expo Router page routes.
  - Presentation vs. Logic Separation: Custom hooks manage state and business logic; presentation components remain focused purely on layout and rendering.
  - React 19 / Compiler Rules: DO NOT introduce manual `useMemo`, `useCallback`, or `React.memo` unless fixing a verified third-party hook reference identity bug. Rely on the React Compiler's automatic memoization.
  - State Management Rules: Components subscribing to Zustand stores MUST use granular slice selectors (e.g. `useStore(state => state.property)`) to prevent unnecessary re-renders. Never destructure a whole store.

  Single Source of Truth (added after the 2026-08-08 production audit):
  - There is exactly ONE rates data layer: `src/api/queries/*.queries.ts` + `src/api/mapper.ts` + `src/models/exchange.models.ts`.
    Features MUST consume it. Do NOT create a feature-local API client, endpoint map, rate mapper, or duplicate
    domain type — a second copy has already caused silent divergence between tabs.
  - There is exactly ONE React Query key namespace per resource. Two keys for the same resource means two caches.
  - NEVER add hardcoded, mocked, or placeholder exchange-rate values to the codebase. Wrong rates are a financial
    harm, not a cosmetic bug. Unavailable data MUST surface as an explicit empty/error state.
  - Derive shared screen state ONCE at the screen level and pass it down. Do NOT call the same data hook in
    several sibling components to avoid prop passing — it multiplies subscriptions and re-render work.

  Configuration & Native Parity:
  - Native code (Kotlin/Swift) MUST NOT hardcode API base URLs or environment branches. Any endpoint the JS layer
    knows about must reach native through config/build injection so the two can never drift.
  - Environment files are selected by `NODE_ENV`, not `APP_ENV` (see `@expo/env`). `APP_ENV` only drives
    `app.config.ts` identity (name, bundle id, scheme). Any script introducing an environment MUST set both,
    and MUST keep `NODE_ENV` one of `development` | `production` | `test` so React is built in the correct mode.
  - `ios/` and `android/` are generated by `expo prebuild` and gitignored. Native changes belong in `app.config.ts`
    or a config plugin under `plugins/` — never as a direct edit to a generated project.

  Production Readiness Bar:
  - No `console.*` on a user-reachable code path in a release build.
  - Every render subtree that can throw is covered by an error boundary; unexpected errors are reported, not swallowed.
  - Interactive elements carry an `accessibilityRole` and a meaningful `accessibilityLabel` when the visible label
    is a glyph, an icon, or otherwise not descriptive.
  - Effects that create timers, subscriptions, or listeners MUST clean up on unmount.

# Per-artifact rules enforced during proposal, specs, design, and task creation
rules:
  proposal:
    - Include explicit "User Impact" and "Technical Scope" sections
    - "MANDATORY: Include a \"Non-Goals\" section defining clear boundaries"
    - State the release risk explicitly when a change touches signing, permissions, native modules, or the API contract
  specs:
    - Requirements MUST be stated as testable "SHALL" or "MUST" capability statements
    - Focus on observable user/system outcomes rather than internal code implementation details
    - Any requirement touching money, rates, or number formatting MUST include a scenario with a concrete worked example
  design:
    - Must detail component hierarchy and state flow (using ASCII or Mermaid diagrams where beneficial)
    - Must detail Unistyles theme tokens and responsive/dynamic layout integration
    - "For changes crossing the JS/native boundary, document both sides and how they stay in sync"
  tasks:
    - Break work into atomic, single-file or tightly-focused task units
    - Every task MUST include concrete verification steps (e.g. static typecheck/lint commands)
    - "Verification for release-configuration changes MUST inspect the generated artifact, not just the source"

# Per-operation guidance for applying and archiving changes
operations:
  apply:
    guidance:
      - Run type checks and lints after edits before declaring a task complete
      - NEVER patch symptoms, swallow exceptions silently, or introduce dummy fallback data
      - Summarize precise file changes and verification results upon completion of each task
      - Report failures honestly with their output; never describe an unverified step as verified
  archive:
    guidance:
      - Verify clean build state before archiving
      - Provide a concise summary of implemented capabilities in the archive output
